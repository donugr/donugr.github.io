<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DONUGR TECH App Showcase</title>
    <meta name="description" content="Bisa anda dapatkan di Google Play Store" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="showcase-index">
    <main class="app-shell">
      <section class="section-heading">
        <h1 class="section-title">Daftar Aplikasi DONUGR TECH</h1>
        <p class="section-subtitle">Bisa anda dapatkan di Google Play Store</p>
      </section>

      <section>
        <div id="appsGrid" class="apps-grid"></div>
      </section>
    </main>

    <script>
      const apps = [{"APP_NAME":"Kas RT/RW","APP_ID":"donugr.kasrtrw.mmxxvi.id","APP_VERSION":"1.0.3","DEFAULT_LANGUAGE":"id","TAGLINE":"Ringkas, cepat, dan siap dipakai untuk operasional kas lingkungan.","SHORT_DESCRIPTION":"Kas RT/RW adalah aplikasi pencatatan kas lingkungan untuk membantu pengelolaan warga, iuran, pemasukan, pengeluaran, inventaris, laporan, backup, dan cetak nota dalam satu aplikasi yang praktis digunakan.","APP_IMAGE":"./donugr.kasrtrw.mmxxvi.id/favicon.png","COVER_IMAGE":"./donugr.kasrtrw.mmxxvi.id/showcase.png"},{"APP_NAME":"LaundryKu","APP_ID":"donugr.laundryku.mmxxvi.id","APP_VERSION":"1.0.0","DEFAULT_LANGUAGE":"id","TAGLINE":"Kelola usaha laundry lebih mudah, cepat, dan profesional.","SHORT_DESCRIPTION":"LaundryKu adalah aplikasi manajemen usaha laundry yang membantu mencatat transaksi, mengelola pelanggan, memantau proses cucian, mengatur pembayaran, serta menyajikan laporan usaha secara praktis dalam satu aplikasi.","APP_IMAGE":"./donugr.laundryku.mmxxvi.id/favicon.png","COVER_IMAGE":"./donugr.laundryku.mmxxvi.id/showcase.png"},{"APP_NAME":"Stok Dapur","APP_ID":"donugr.stokdapur.mmxxvi.id","APP_VERSION":"1.0.0","DEFAULT_LANGUAGE":"id","TAGLINE":"Catat stok bahan dapur lebih cepat, rapi, dan mudah dipantau.","SHORT_DESCRIPTION":"Stok Dapur adalah aplikasi pencatatan stok bahan dapur untuk membantu operasional harian, pencarian bahan, kontrol stok masuk dan stok keluar, serta dokumentasi bahan dalam satu aplikasi yang mudah digunakan.","APP_IMAGE":"./donugr.stokdapur.mmxxvi.id/favicon.png","COVER_IMAGE":"./donugr.stokdapur.mmxxvi.id/showcase.png"},{"APP_NAME":"TokoPakan","APP_ID":"donugr.tokopakan.mmxxvi.id","APP_VERSION":"1.0.0","DEFAULT_LANGUAGE":"id","TAGLINE":"Kelola Toko Pakan Lebih Cepat, Rapi, dan Menguntungkan","SHORT_DESCRIPTION":"Aplikasi kasir dan manajemen toko pakan untuk mencatat penjualan, pembelian, stok, pelanggan, supplier, serta laporan usaha dalam satu aplikasi yang mudah digunakan.","APP_IMAGE":"./donugr.tokopakan.mmxxvi.id/favicon.png","COVER_IMAGE":"./donugr.tokopakan.mmxxvi.id/showcase.png"}];

      function shuffle(items) {
        const result = [...items];
        for (let index = result.length - 1; index > 0; index -= 1) {
          const nextIndex = Math.floor(Math.random() * (index + 1));
          [result[index], result[nextIndex]] = [result[nextIndex], result[index]];
        }
        return result;
      }

      function renderAppCard(app) {
        return `
          <a class="app-card" href="./${app.APP_ID}/index.html">
            <div class="app-cover">
              <img src="${app.COVER_IMAGE}" alt="${app.APP_NAME} cover" loading="lazy" />
            </div>
            <div class="app-body">
              <img class="app-icon" src="${app.APP_IMAGE}" alt="${app.APP_NAME} icon" loading="lazy" />
              <div>
                <h2 class="app-name">${app.APP_NAME}</h2>
                <p class="app-tagline">${app.TAGLINE || app.SHORT_DESCRIPTION || ""}</p>
                <div class="app-meta">${[app.DEFAULT_LANGUAGE, app.APP_VERSION].filter(Boolean).join(" · ")}</div>
              </div>
            </div>
          </a>
        `;
      }

      function renderApps() {
        const grid = document.getElementById("appsGrid");
        const items = shuffle(Array.isArray(apps) ? apps : []);

        if (!items.length) {
          grid.innerHTML = '<div class="empty-state">Belum ada app showcase yang tersedia.</div>';
          return;
        }

        grid.innerHTML = items.map(renderAppCard).join("");
      }

      renderApps();
    </script>
  </body>
</html>
